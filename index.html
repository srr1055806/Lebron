<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lebron</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-w: 240px;
            --header-h: 56px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #09090f;
            font-family: 'DM Sans', system-ui, sans-serif;
            color: rgba(255,255,255,0.75);
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* ── Header ── */
        #header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--header-h);
            background: #0c0c15;
            border-bottom: 1px solid rgba(255,255,255,0.055);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
            z-index: 100;
        }

        /* ── Sidebar ── */
        #sidebar {
            position: fixed;
            top: var(--header-h);
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: #0e0e19;
            border-right: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            transition: width 0.25s cubic-bezier(0.4,0,0.2,1);
            z-index: 50;
        }

        #sidebar.closed { width: 0; }

        #sidebar-inner {
            width: var(--sidebar-w);
            height: 100%;
            overflow-y: auto;
            padding: 14px 10px 20px;
        }

        /* ── Main ── */
        #main {
            position: fixed;
            top: var(--header-h);
            left: var(--sidebar-w);
            right: 0;
            bottom: 0;
            transition: left 0.25s cubic-bezier(0.4,0,0.2,1);
            background: #0a0a12;
        }

        #main.full { left: 0; }

        /* ── iframe ── */
        #webframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ── Loading bar ── */
        #load-bar {
            position: absolute;
            top: 0; left: 0;
            height: 2px;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6 0%, #818cf8 50%, #a78bfa 100%);
            z-index: 20;
            transition: width 0.3s ease, opacity 0.3s ease;
            pointer-events: none;
        }

        @keyframes loadPulse {
            0%   { width: 0%; }
            25%  { width: 40%; }
            50%  { width: 65%; }
            75%  { width: 80%; }
            90%  { width: 88%; }
            100% { width: 93%; }
        }

        #load-bar.loading {
            animation: loadPulse 6s ease forwards;
        }

        /* ── Error overlay ── */
        #error-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9,9,15,0.93);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            z-index: 10;
        }

        #error-overlay.show { display: flex; }

        .err-box {
            text-align: center;
            max-width: 380px;
            padding: 36px 32px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
        }

        .err-icon {
            font-size: 40px;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 20px rgba(251,191,36,0.3));
        }

        .err-title {
            font-size: 17px;
            font-weight: 600;
            color: rgba(255,255,255,0.92);
            margin-bottom: 8px;
        }

        .err-body {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .err-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            background: rgba(255,255,255,0.07);
            padding: 1px 5px;
            border-radius: 4px;
            color: rgba(255,255,255,0.6);
        }

        .err-btn-primary {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 9px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.15s, transform 0.1s;
            display: block;
            width: 100%;
            margin-bottom: 10px;
        }

        .err-btn-primary:hover { background: #2563eb; }
        .err-btn-primary:active { transform: scale(0.98); }

        .err-btn-dismiss {
            background: transparent;
            color: rgba(255,255,255,0.3);
            border: none;
            font-size: 12px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.15s;
        }

        .err-btn-dismiss:hover { color: rgba(255,255,255,0.6); }

        /* ── Icon button ── */
        .ibtn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            flex-shrink: 0;
            transition: color 0.15s, background 0.15s;
        }

        .ibtn:hover:not(:disabled) {
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.07);
        }

        .ibtn:disabled {
            color: rgba(255,255,255,0.18);
            cursor: not-allowed;
        }

        .ibtn.on {
            color: #3b82f6;
            background: rgba(59,130,246,0.12);
        }

        /* ── URL bar wrapper ── */
        #url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 22px;
            padding: 0 6px 0 13px;
            height: 34px;
            transition: border-color 0.15s, background 0.15s;
            min-width: 0;
        }

        #url-bar.focused {
            border-color: rgba(59,130,246,0.45);
            background: rgba(255,255,255,0.07);
        }

        #url-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: rgba(255,255,255,0.88);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            min-width: 0;
        }

        #url-input::placeholder { color: rgba(255,255,255,0.2); }

        /* ── Divider ── */
        .vdiv {
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.07);
            flex-shrink: 0;
        }

        /* ── CORS toggle ── */
        .cors-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            position: relative;
        }

        .cors-label {
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
            white-space: nowrap;
            user-select: none;
        }

        .pill-wrap {
            position: relative;
            width: 36px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .pill-wrap input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .pill-track {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.08);
            transition: background 0.2s, border-color 0.2s;
        }

        .pill-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            transition: transform 0.2s, background 0.2s;
        }

        .pill-wrap input:checked ~ .pill-track {
            background: rgba(59,130,246,0.3);
            border-color: rgba(59,130,246,0.45);
        }

        .pill-wrap input:checked ~ .pill-thumb {
            transform: translateX(16px);
            background: #3b82f6;
        }

        /* ── Tooltip ── */
        .tip-wrap {
            position: relative;
        }

        .tip-wrap .tip {
            position: absolute;
            bottom: calc(100% + 8px);
            right: 0;
            background: #1a1a2a;
            border: 1px solid rgba(255,255,255,0.09);
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 7px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            z-index: 999;
            font-family: 'DM Sans', sans-serif;
        }

        .tip-wrap:hover .tip { opacity: 1; }

        /* ── Sidebar UI ── */
        .sec-title {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.22);
            padding: 0 8px;
            margin-bottom: 3px;
        }

        .sec-title.mt { margin-top: 18px; }

        .s-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 7px;
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: 'DM Sans', sans-serif;
        }

        .s-link:hover {
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.06);
        }

        .s-link-badge {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            background: rgba(255,255,255,0.07);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .s-divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 12px 2px;
        }

        /* ── Fav item ── */
        .fav-item {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 6px 10px;
            border-radius: 7px;
            color: rgba(255,255,255,0.45);
            font-size: 12px;
            cursor: default;
            transition: color 0.15s, background 0.15s;
        }

        .fav-item:hover {
            color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.05);
        }

        .fav-url-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            font-size: 12px;
        }

        .fav-del {
            opacity: 0;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1;
            transition: opacity 0.15s, color 0.15s;
            flex-shrink: 0;
            cursor: pointer;
            color: rgba(255,255,255,0.3);
        }

        .fav-item:hover .fav-del { opacity: 1; }
        .fav-del:hover { color: #f87171 !important; }

        .no-favs {
            font-size: 11px;
            color: rgba(255,255,255,0.18);
            padding: 6px 10px;
            font-style: italic;
        }

        /* ── Lock scroll ── */
        body.scroll-locked { overflow: hidden; }
    </style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<header id="header">

    <!-- Hamburger -->
    <button class="ibtn" id="menu-btn" title="Toggle Sidebar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <div class="vdiv"></div>

    <!-- Back -->
    <button class="ibtn" id="back-btn" title="Back" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </button>

    <!-- Forward -->
    <button class="ibtn" id="fwd-btn" title="Forward" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
        </svg>
    </button>

    <!-- Reload -->
    <button class="ibtn" id="reload-btn" title="Reload">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
    </button>

    <!-- URL bar -->
    <div id="url-bar">
        <!-- Lock icon -->
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="text" id="url-input" placeholder="Enter URL — e.g. wikipedia.org" autocomplete="off" spellcheck="false">
        <!-- Go arrow -->
        <button class="ibtn" id="go-btn" style="width:26px;height:26px;border-radius:13px;" title="Navigate">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </div>

    <!-- Star / Favorite -->
    <button class="ibtn" id="star-btn" title="Save to Favorites">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
    </button>

    <div class="vdiv"></div>

    <!-- Lock scroll -->
    <button class="ibtn" id="scroll-btn" title="Lock Page Scroll">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </button>

    <!-- CORS toggle -->
    <div class="tip-wrap">
        <div class="cors-wrap">
            <span class="cors-label">CORS</span>
            <label class="pill-wrap">
                <input type="checkbox" id="cors-chk">
                <span class="pill-track"></span>
                <span class="pill-thumb"></span>
            </label>
        </div>
        <div class="tip">Helps load sites blocked by cross-origin restrictions</div>
    </div>

    <div class="vdiv"></div>

    <!-- Fullscreen -->
    <button class="ibtn" id="fs-btn" title="Toggle Fullscreen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
    </button>

</header>

<!-- ══════════ SIDEBAR ══════════ -->
<nav id="sidebar">
    <div id="sidebar-inner">

        <div class="sec-title">Quick Links</div>
        <div id="quick-links"></div>

        <div class="s-divider"></div>

        <div class="sec-title">Favorites</div>
        <div id="fav-list"></div>
        <div id="no-favs" class="no-favs">No favorites yet — click ★ to save.</div>

    </div>
</nav>

<!-- ══════════ MAIN ══════════ -->
<main id="main">
    <div id="load-bar"></div>

    <!-- Error overlay -->
    <div id="error-overlay">
        <div class="err-box">
            <div class="err-icon">⚠</div>
            <div class="err-title">Site blocked iframe embedding</div>
            <div class="err-body">
                This site sends an <code>X-Frame-Options</code> header that prevents loading inside a frame. Enable the CORS Proxy to bypass this restriction and retry.
            </div>
            <button class="err-btn-primary" id="err-proxy-btn">Enable CORS Proxy &amp; Retry</button>
            <button class="err-btn-dismiss" id="err-dismiss-btn">Dismiss</button>
        </div>
    </div>

    <iframe id="webframe" src="about:blank" allowfullscreen
        allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>
</main>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const QUICK_LINKS = [
    { label: 'Wikipedia',   url: 'https://en.wikipedia.org',          badge: 'W' },
    { label: 'Reddit',      url: 'https://old.reddit.com',            badge: 'R' },
    { label: 'Archive.org', url: 'https://archive.org',               badge: 'A' },
    { label: 'BBC News',    url: 'https://bbc.com/news',              badge: 'B' },
    { label: 'Hacker News', url: 'https://news.ycombinator.com',      badge: 'H' },
];

const CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
const FAV_KEY    = 'webframe_favorites_v1';

// ── State ────────────────────────────────────────────────────────────────────
let sidebarOpen  = true;
let scrollLocked = false;
let corsOn       = false;
let currentUrl   = '';
let navHistory   = [];
let navIdx       = -1;
let loadTimer    = null;

// ── Elements ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const header     = $('header') || document.querySelector('header');
const sidebar    = $('sidebar');
const main       = $('main');
const webframe   = $('webframe');
const urlInput   = $('url-input');
const urlBar     = $('url-bar');
const loadBar    = $('load-bar');
const errOverlay = $('error-overlay');
const quickEl    = $('quick-links');
const favListEl  = $('fav-list');
const noFavsEl   = $('no-favs');
const backBtn    = $('back-btn');
const fwdBtn     = $('fwd-btn');
const reloadBtn  = $('reload-btn');
const goBtn      = $('go-btn');
const starBtn    = $('star-btn');
const scrollBtn  = $('scroll-btn');
const corsChk    = $('cors-chk');
const fsBtn      = $('fs-btn');
const menuBtn    = $('menu-btn');
const errProxyBtn   = $('err-proxy-btn');
const errDismissBtn = $('err-dismiss-btn');

// ── URL helpers ──────────────────────────────────────────────────────────────
function normalize(raw) {
    let u = raw.trim();
    if (!u) return '';
    if (!u.startsWith('http://') && !u.startsWith('https://')) u = 'https://' + u;
    return u;
}

function applyProxy(url) {
    if (!corsOn) return url;
    if (url.startsWith(CORS_PROXY)) return url;
    return CORS_PROXY + url;
}

// ── Navigate ─────────────────────────────────────────────────────────────────
function navigate(rawUrl, push = true) {
    const url = normalize(rawUrl);
    if (!url) return;

    currentUrl = url;
    urlInput.value = url;

    if (push) {
        navHistory = navHistory.slice(0, navIdx + 1);
        navHistory.push(url);
        navIdx = navHistory.length - 1;
    }

    updateNavBtns();
    updateStar();
    startLoad();
    hideError();
    webframe.src = applyProxy(url);
}

// ── History ──────────────────────────────────────────────────────────────────
function updateNavBtns() {
    backBtn.disabled = navIdx <= 0;
    fwdBtn.disabled  = navIdx >= navHistory.length - 1;
}

backBtn.addEventListener('click', () => {
    if (navIdx > 0) { navIdx--; navigate(navHistory[navIdx], false); }
});

fwdBtn.addEventListener('click', () => {
    if (navIdx < navHistory.length - 1) { navIdx++; navigate(navHistory[navIdx], false); }
});

reloadBtn.addEventListener('click', () => {
    startLoad();
    webframe.src = webframe.src;
});

goBtn.addEventListener('click', () => navigate(urlInput.value));
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(urlInput.value); });

// ── URL bar focus ─────────────────────────────────────────────────────────────
urlInput.addEventListener('focus', () => {
    urlBar.classList.add('focused');
    urlInput.select();
});
urlInput.addEventListener('blur', () => urlBar.classList.remove('focused'));

// ── Loading bar ───────────────────────────────────────────────────────────────
function startLoad() {
    clearTimeout(loadTimer);
    loadBar.style.transition = 'none';
    loadBar.style.opacity    = '1';
    loadBar.style.width      = '0%';
    loadBar.classList.remove('loading');

    // Force reflow then animate
    void loadBar.offsetWidth;
    loadBar.classList.add('loading');

    // Fallback error after 8s
    loadTimer = setTimeout(() => {
        stopLoad();
        showError();
    }, 8000);
}

function stopLoad() {
    clearTimeout(loadTimer);
    loadBar.classList.remove('loading');
    loadBar.style.transition = 'width 0.2s ease, opacity 0.4s ease';
    loadBar.style.width      = '100%';
    setTimeout(() => { loadBar.style.opacity = '0'; }, 300);
    setTimeout(() => { loadBar.style.width = '0%'; loadBar.style.opacity = '1'; }, 700);
}

// ── iframe load / error ───────────────────────────────────────────────────────
webframe.addEventListener('load', () => {
    stopLoad();
    if (!webframe.src || webframe.src === 'about:blank') return;

    // Try to detect blank/blocked frames
    try {
        const doc = webframe.contentDocument;
        if (doc && doc.body && doc.body.innerHTML.trim() === '') {
            showError();
        }
        // If SecurityError thrown → cross-origin → loaded fine → no error
    } catch (_) {}
});

webframe.addEventListener('error', () => { stopLoad(); showError(); });

// ── Error overlay ─────────────────────────────────────────────────────────────
function showError() { errOverlay.classList.add('show'); }
function hideError() { errOverlay.classList.remove('show'); }

errProxyBtn.addEventListener('click', () => {
    hideError();
    corsChk.checked = true;
    corsOn = true;
    navigate(currentUrl);
});

errDismissBtn.addEventListener('click', hideError);

// ── Sidebar ───────────────────────────────────────────────────────────────────
menuBtn.addEventListener('click', () => {
    sidebarOpen = !sidebarOpen;
    sidebar.classList.toggle('closed', !sidebarOpen);
    main.classList.toggle('full', !sidebarOpen);
});

// ── CORS proxy ────────────────────────────────────────────────────────────────
corsChk.addEventListener('change', () => { corsOn = corsChk.checked; });

// ── Scroll lock ───────────────────────────────────────────────────────────────
scrollBtn.addEventListener('click', () => {
    scrollLocked = !scrollLocked;
    document.body.classList.toggle('scroll-locked', scrollLocked);
    scrollBtn.classList.toggle('on', scrollLocked);
    scrollBtn.title = scrollLocked ? 'Unlock Scroll' : 'Lock Page Scroll';
});

// ── Fullscreen ────────────────────────────────────────────────────────────────
fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen();
    }
});

document.addEventListener('fullscreenchange', () => {
    const inFs = !!document.fullscreenElement;
    fsBtn.classList.toggle('on', inFs);
});

// ── Favorites ─────────────────────────────────────────────────────────────────
function getFavs()        { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }
function setFavs(favs)    { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }

function updateStar() {
    const favs   = getFavs();
    const active = currentUrl && favs.includes(currentUrl);
    starBtn.classList.toggle('on', active);
    const svg = starBtn.querySelector('svg');
    svg.setAttribute('fill',   active ? '#3b82f6' : 'none');
    svg.setAttribute('stroke', active ? '#3b82f6' : 'currentColor');
}

starBtn.addEventListener('click', () => {
    if (!currentUrl) return;
    let favs = getFavs();
    const i  = favs.indexOf(currentUrl);
    if (i === -1) favs.push(currentUrl); else favs.splice(i, 1);
    setFavs(favs);
    updateStar();
    renderFavs();
});

function renderFavs() {
    const favs = getFavs();
    favListEl.innerHTML = '';
    noFavsEl.style.display = favs.length ? 'none' : 'block';

    favs.forEach(url => {
        const row  = document.createElement('div');
        row.className = 'fav-item';

        const label = document.createElement('span');
        label.className = 'fav-url-text';
        label.title     = url;
        label.textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        label.addEventListener('click', () => navigate(url));

        const del = document.createElement('span');
        del.className   = 'fav-del';
        del.textContent = '×';
        del.addEventListener('click', e => {
            e.stopPropagation();
            let favs = getFavs();
            favs = favs.filter(f => f !== url);
            setFavs(favs);
            updateStar();
            renderFavs();
        });

        row.appendChild(label);
        row.appendChild(del);
        favListEl.appendChild(row);
    });
}

// ── Quick links ───────────────────────────────────────────────────────────────
function renderQuickLinks() {
    QUICK_LINKS.forEach(({ label, url, badge }) => {
        const btn = document.createElement('button');
        btn.className = 's-link';
        btn.innerHTML = `
            <span class="s-link-badge">${badge}</span>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</span>
        `;
        btn.addEventListener('click', () => navigate(url));
        quickEl.appendChild(btn);
    });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
renderQuickLinks();
renderFavs();
navigate('https://en.wikipedia.org');
</script>
</body>
</html>
